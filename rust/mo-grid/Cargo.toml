[package]
name = "mo-grid"
description = "MobileOffice spreadsheet bridge over the GridCraft engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gridcraft-pdf = { workspace = true }
wordcraft-fonts = { workspace = true }
gridcraft-engine = { workspace = true }
gridcraft-functions = { workspace = true }
gridcraft-chart = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
encoding_rs = "0.8"
cfb = "0.15"

[dev-dependencies]
zip = { version = "3", default-features = false, features = ["deflate"] }
