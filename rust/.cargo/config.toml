[net]
# Use the git CLI so git dependencies go through the configured proxy and credentials.
git-fetch-with-cli = true

# Google Play requires 16 KB-aligned native libraries for apps targeting Android 15+.
# NDK r28+ already links this way; the flag keeps it true for older NDKs too.
# --pack-dyn-relocs=android packs the ~150,000 relative relocations (about 3.5 MB as plain RELA)
# into Android's compact format, which every Android from 6.0 (API 23) loads; minSdk is 26
# (docs/BOYUT.md). cargo-ndk keeps these rustflags: it passes its own flags through the linker.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,--pack-dyn-relocs=android"]
[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,--pack-dyn-relocs=android"]
[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,--pack-dyn-relocs=android"]
