[package]
name = "gridcraft-pdf"
# GridCraft's PDF writer at commit c0ee120ac2d9b59630f5abf1151dd9b471fe2926, with Turkish letters
# set through the standard fonts (see PATCHES.md). Same version as upstream, so Cargo takes it in
# place of the git crate.
version = "0.19.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GridCraft's tiny self-contained PDF 1.7 writer (standard 14 fonts, vector drawing, RGBA images)"

[dependencies]
# For embedding TrueType faces (fonts.rs): reading their metrics and compressing them.
ttf-parser = "0.25"
miniz_oxide = "0.8"

# Upstream's workspace lints, which this copy no longer inherits.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
type_complexity = "allow"
