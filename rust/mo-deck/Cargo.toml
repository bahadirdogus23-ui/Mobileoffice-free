[package]
name = "mo-deck"
description = "MobileOffice presentation bridge over the DeckCraft engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Only the PPTX reader and the slide renderer: viewing needs neither the editing engine nor the
# audio/video codecs, so they stay out of the app.
deckcraft-pptx = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-pdf = { workspace = true }
# Measures table rows as they are drawn (already in the tree through the renderer).
deckcraft-text = { workspace = true }
# DeckCraft's font database: the app's bundled faces are added to it (src/fonts.rs).
deckcraft-fonts = { workspace = true }
# The OFL faces WordCraft compiles in; Inter is shared with the slides (src/fonts.rs). Already in the app.
wordcraft-fonts = { workspace = true }
thiserror = { workspace = true }
# OpenDocument presentations (.odp), which DeckCraft has no reader for (src/odp.rs).
zip = { version = "3", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
# Old binary PowerPoint (.ppt), read for its text (src/ppt.rs).
cfb = "0.15"
# Package integrity check on opening (mo_convert::package).
mo-convert = { workspace = true }

[dev-dependencies]
# The engine's built-in sample deck gives the tests a real presentation.
deckcraft-engine = { workspace = true }
# Writes the small picture the tests add to a slide (already in the tree through the renderer).
png = "0.18"
