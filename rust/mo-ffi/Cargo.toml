[package]
name = "mo-ffi"
description = "MobileOffice native library: UniFFI interface the Android app calls"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# cdylib only: libmo_ffi.so for Android, read by uniffi-bindgen with `--library`; unit tests still build.
# Do not add "lib" back: rustc skips LTO when an rlib is among the outputs, and the release .so then
# grows by about a quarter (docs/BOYUT.md).
crate-type = ["cdylib"]
name = "mo_ffi"

[dependencies]
mo-archive = { workspace = true }
mo-convert = { workspace = true }
mo-grid = { workspace = true }
mo-word = { workspace = true }
mo-deck = { workspace = true }
mo-cad = { workspace = true }
mo-pdf = { workspace = true }
uniffi = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
zip = { version = "3", default-features = false, features = ["deflate"] }
