[workspace]
resolver = "3"
members = ["mo-archive", "mo-convert", "mo-grid", "mo-word", "mo-deck", "mo-cad", "mo-pdf", "mo-ffi", "uniffi-bindgen", "vendor/gridcraft-pdf"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bahadirdogus23-ui/Mobileoffice-free"

[workspace.dependencies]
# ArtCraft engines, pinned to reviewed commits (docs/RAPOR-VE-PLAN.md §9.10).
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "c4fafc215490a0186ee750454b1ce73a9823daed" }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", rev = "c4fafc215490a0186ee750454b1ce73a9823daed" }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "c4fafc215490a0186ee750454b1ce73a9823daed" }
wordcraft-fonts = { git = "https://github.com/storytold/wordcraft", rev = "c4fafc215490a0186ee750454b1ce73a9823daed" }
wordcraft-formats = { git = "https://github.com/storytold/wordcraft", rev = "c4fafc215490a0186ee750454b1ce73a9823daed" }
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "c4fafc215490a0186ee750454b1ce73a9823daed" }
deckcraft-pptx = { git = "https://github.com/storytold/deckcraft", rev = "55e5ee56b4b2c64973b78fda4182a78f9766fa62" }
deckcraft-render = { git = "https://github.com/storytold/deckcraft", rev = "55e5ee56b4b2c64973b78fda4182a78f9766fa62" }
deckcraft-model = { git = "https://github.com/storytold/deckcraft", rev = "55e5ee56b4b2c64973b78fda4182a78f9766fa62" }
deckcraft-pdf = { git = "https://github.com/storytold/deckcraft", rev = "55e5ee56b4b2c64973b78fda4182a78f9766fa62" }
deckcraft-engine = { git = "https://github.com/storytold/deckcraft", rev = "55e5ee56b4b2c64973b78fda4182a78f9766fa62" }
deckcraft-text = { git = "https://github.com/storytold/deckcraft", rev = "55e5ee56b4b2c64973b78fda4182a78f9766fa62" }
cadcraft-io = { git = "https://github.com/storytold/cadcraft", rev = "56542407292b911ad30523cfcfa987923fe2f8e2" }
cadcraft-render = { git = "https://github.com/storytold/cadcraft", rev = "56542407292b911ad30523cfcfa987923fe2f8e2" }
cadcraft-doc = { git = "https://github.com/storytold/cadcraft", rev = "56542407292b911ad30523cfcfa987923fe2f8e2" }
cadcraft-geom = { git = "https://github.com/storytold/cadcraft", rev = "56542407292b911ad30523cfcfa987923fe2f8e2" }
cadcraft-color = { git = "https://github.com/storytold/cadcraft", rev = "56542407292b911ad30523cfcfa987923fe2f8e2" }
cadcraft-engine = { git = "https://github.com/storytold/cadcraft", rev = "56542407292b911ad30523cfcfa987923fe2f8e2" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
pdfcraft-annot = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
pdfcraft-fonts = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
pdfcraft-create = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
pdfcraft-forms = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
pdfcraft-redact = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
pdfcraft-optimize = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
pdfcraft-organize = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
pdfcraft-edit = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "c0ee120ac2d9b59630f5abf1151dd9b471fe2926" }
gridcraft-functions = { git = "https://github.com/storytold/gridcraft", rev = "c0ee120ac2d9b59630f5abf1151dd9b471fe2926" }
gridcraft-chart = { git = "https://github.com/storytold/gridcraft", rev = "c0ee120ac2d9b59630f5abf1151dd9b471fe2926" }
# Patched in from vendor/gridcraft-pdf (see the [patch] section below).
gridcraft-pdf = { git = "https://github.com/storytold/gridcraft", rev = "c0ee120ac2d9b59630f5abf1151dd9b471fe2926" }
uniffi = "0.32"
serde_json = "1"
thiserror = "2"
mo-archive = { path = "mo-archive" }
mo-convert = { path = "mo-convert" }
mo-grid = { path = "mo-grid" }
mo-word = { path = "mo-word" }
mo-deck = { path = "mo-deck" }
mo-cad = { path = "mo-cad" }
mo-pdf = { path = "mo-pdf" }

# Dependencies without debug info in dev builds: the engines' debug info filled tens of GB.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
# The engines' never-crash guards catch panics, so unwinding must stay on.
panic = "unwind"

# Drawing files are heavy to read and draw: their engines are built for speed, the rest for size.
[profile.release.package.cadcraft-engine]
opt-level = 3

[profile.release.package.cadcraft-color]
opt-level = 3
[profile.release.package.cadcraft-doc]
opt-level = 3
[profile.release.package.cadcraft-dwg]
opt-level = 3
[profile.release.package.cadcraft-dxf]
opt-level = 3
[profile.release.package.cadcraft-fonts]
opt-level = 3
[profile.release.package.cadcraft-geom]
opt-level = 3
[profile.release.package.cadcraft-io]
opt-level = 3
[profile.release.package.cadcraft-render]
opt-level = 3
[profile.release.package.kurbo]
opt-level = 3
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
# mo-cad culls and simplifies every CAD frame before drawing it.
[profile.release.package.mo-cad]
opt-level = 3

# WordCraft's PDF writer needs the same krilla revision its own workspace patches in.
[patch.crates-io]
# PdfCraft reads PDFs with its own patched hayro and lopdf crates (only PdfCraft uses them here).
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "20eebc1c33ff7e6f42ac1c56bf95192f628a9d97" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }

# GridCraft's PDF writer with Turkish letters in the standard fonts (vendor/gridcraft-pdf/PATCHES.md).
[patch."https://github.com/storytold/gridcraft"]
gridcraft-pdf = { path = "vendor/gridcraft-pdf" }
