[workspace]
resolver = "3"
members = ["mo-grid", "mo-ffi", "uniffi-bindgen"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bahadirdogus23-ui/Mobileoffice-free"

[workspace.dependencies]
# ArtCraft engines, pinned to reviewed commits (docs/RAPOR-VE-PLAN.md §9.10).
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "11bb67386c9bb19b0717e21e98adc608162ae2e5" }
uniffi = "0.32"
serde_json = "1"
thiserror = "2"
mo-grid = { path = "mo-grid" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
# The engines' never-crash guards catch panics, so unwinding must stay on.
panic = "unwind"
