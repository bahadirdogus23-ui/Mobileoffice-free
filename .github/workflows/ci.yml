name: CI

on:
  push:
    branches: [main, "ccr-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "28.2.13676358"   # AGP 9.4's default NDK; 16 KB-aligned by default

jobs:
  rust:
    name: Rust engines + Kotlin bindings (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace
      - name: Test Android package validation
        run: python3 -m unittest discover -s scripts -p 'test_android_packages.py'
      - name: Verify saved PDF redaction with an independent reader
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          bash scripts/check-pdf-redaction.sh
      - name: Read saved Office documents with independent libraries
        run: |
          python3 -m venv "$RUNNER_TEMP/mobileoffice-interop"
          source "$RUNNER_TEMP/mobileoffice-interop/bin/activate"
          python -m pip install -r scripts/interop-requirements.txt
          bash scripts/check-office-interop.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin ⇄ Rust smoke test on the JVM
        run: |
          cargo build --manifest-path rust/Cargo.toml -p mo-ffi
          ./tools/jvm-smoke/gradlew -p tools/jvm-smoke test --console=plain

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build native engines and Kotlin bindings
        run: scripts/build-native.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and run lint
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - name: Build the release (minified) APKs and the Play bundle
        working-directory: android
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          MO_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          MO_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          MO_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          build_backup=""
          restore_outputs() {
            if [ -n "$build_backup" ] && [ -d "$build_backup/apk" ]; then
              mkdir -p app/build/outputs app/build/reports
              cp -a "$build_backup/apk" app/build/outputs/
              if [ -d "$build_backup/reports" ]; then
                cp -a "$build_backup/reports/." app/build/reports/
              fi
              rm -r "$build_backup"
              build_backup=""
            fi
          }
          trap 'rm -f "$RUNNER_TEMP/upload.jks"; restore_outputs' EXIT
          # The upload key exists only when the owner has added it as repository secrets.
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export MO_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
            echo "Play upload key configured; verify the resulting artifact signature before upload." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Play upload key: release artifacts use the debug key and are for testing only." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Keep split APKs, then build the bundle with no stale split resources.
          ./gradlew assembleRelease --console=plain
          build_backup="$(mktemp -d "$RUNNER_TEMP/mobileoffice-apks-reports.XXXXXX")"
          cp -a app/build/outputs/apk "$build_backup/apk"
          cp -a app/build/reports "$build_backup/reports"
          ./gradlew clean bundleRelease -Pmo.abiSplits=false --console=plain
          test -s app/build/outputs/bundle/release/app-release.aab
          restore_outputs
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            test -s "app/build/outputs/apk/release/app-$abi-release.apk"
          done
          ls -l app/build/outputs/apk/release/ app/build/outputs/bundle/release/
      - name: Verify packaged engines and report package sizes
        run: |
          for variant in debug release; do
            for abi in arm64-v8a armeabi-v7a x86_64; do
              python3 scripts/check_android_packages.py \
                "android/app/build/outputs/apk/$variant/app-$abi-$variant.apk" \
                --abis "$abi" --report "android/app/build/reports/packages/$variant-$abi.json"
            done
            python3 scripts/check_android_packages.py \
              "android/app/build/outputs/apk/$variant/app-universal-$variant.apk" \
              --abis arm64-v8a armeabi-v7a x86_64 --report "android/app/build/reports/packages/$variant-universal.json"
          done
          python3 scripts/check_android_packages.py android/app/build/outputs/bundle/release/app-release.aab \
            --abis arm64-v8a armeabi-v7a x86_64 --report android/app/build/reports/packages/release-bundle.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-size-reports
          path: android/app/build/reports/packages/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mobileoffice-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Show lint findings
        if: failure()
        run: find android -path '*lint_intermediate_text_report*' -name '*.txt' -exec cat {} +
      - name: Check 16 KB alignment of the packaged APK
        run: |
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" | tail -1
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          done
          ls -l android/app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: mobileoffice-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Every green push replaces the APK on the "gelistirme" pre-release, so there is one fixed link:
  # https://github.com/<owner>/<repo>/releases/download/gelistirme/MobileOffice-Free.apk
  release:
    name: Publish test build
    needs: [rust, android]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: gelistirme
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mobileoffice-debug-apk
      - uses: actions/download-artifact@v4
        with:
          name: mobileoffice-release
          path: release
      - name: Update the pre-release
        run: |
          # The plain name is the 64-bit ARM build, which nearly every phone from the last years is.
          mv app-arm64-v8a-debug.apk MobileOffice-Free.apk
          mv app-armeabi-v7a-debug.apk MobileOffice-Free-eski-32bit.apk
          mv app-x86_64-debug.apk MobileOffice-Free-x86_64.apk
          mv app-universal-debug.apk MobileOffice-Free-hepsi-bir-arada.apk
          # The release build as Google Play will ship it (minified), to test before uploading.
          mv release/apk/release/app-arm64-v8a-release.apk MobileOffice-Free-yayin-denemesi.apk
          apks=(MobileOffice-Free*.apk)
          notes="Otomatik test sürümü 0.1.0-dev.${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}, ${GITHUB_REF_NAME}).
          Bu bir geliştirme sürümüdür; hata içerebilir. Kurmak için telefonda bilinmeyen kaynaklardan
          yüklemeye izin verin. Sonraki test sürümleri bunun üzerine kurulur.

          Hangi dosya? Çoğu telefon için MobileOffice-Free.apk (64 bit ARM). Kurulmazsa eski telefonlar
          için MobileOffice-Free-eski-32bit.apk, emin değilseniz MobileOffice-Free-hepsi-bir-arada.apk.
          Gerekli: Android 8.0 veya üstü.

          Automatic test build; it may have bugs."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload "$TAG" "${apks[@]}" --clobber
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" "${apks[@]}" --target "$GITHUB_SHA" --prerelease \
              --title "Geliştirme sürümü (test)" --notes "$notes"
          fi
          echo "https://github.com/$GH_REPO/releases/download/$TAG/MobileOffice-Free.apk" >> "$GITHUB_STEP_SUMMARY"
